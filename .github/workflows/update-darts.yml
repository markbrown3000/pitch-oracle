# Updates the Darts tab's data (data/darts.json) every two hours.
# Results, draws and three-dart averages come from Wikipedia's PDC event pages; the model is tools/darts_model.py.
name: Update darts data
on:
  schedule:
    - cron: "47 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/darts.py", "tools/darts_parse.py", "tools/darts_model.py", "tools/darts_mc.py", ".github/workflows/update-darts.yml"]
permissions:
  contents: write
concurrency:
  group: darts
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install numpy
      - name: Fetch results and draws, run the model
        run: python3 tools/darts.py
      - name: Save if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/darts.json data/darts_state.json data/darts_pc.json data/darts_matches.json
          git diff --cached --quiet || (git commit -m "Update darts data" && (git push || (git pull --rebase && git push)))
