name: probe-gs
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          UA="Mozilla/5.0 (compatible; PitchOracle/1.0; +https://github.com/markbrown3000/pitch-oracle)"
          for u in results fixtures schedule draw ""; do curl -sSL -A "$UA" -o "probe/mc_$u.html" -w "$u %{http_code} %{size_download} %{url_effective}\n" "https://mastercaller.com/tournaments/grand-slam-of-darts/2026/$u"; done
          curl -sSL -A "$UA" -o probe/mc_2025.html -w "2025 %{http_code} %{size_download}\n" "https://mastercaller.com/tournaments/grand-slam-of-darts/2025/results"
          curl -sSL -A "$UA" -o probe/mc_pcf.html -w "pcf %{http_code} %{size_download}\n" "https://mastercaller.com/tournaments/players-championship-finals/2026/results"
      - uses: actions/upload-artifact@v4
        with: {name: probe, path: probe}
