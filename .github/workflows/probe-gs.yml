name: probe-gs
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q numpy && cd tools && python3 - <<'PY'
          import re, collections, darts as E
          from darts_parse import parse_page, event_range, best_of
          pg=E.fetch(["2025 Grand Slam of Darts","2026 Grand Slam of Darts"])
          t=pg["2026 Grand Slam of Darts"]
          print("RANGE", event_range(t,"2026 Grand Slam of Darts"), "DEFBO", best_of(re.sub(r"\{\{.*?\}\}", "", t[:20000])))
          for m in re.finditer(r"best of[^\n]{0,80}|first to[^\n]{0,80}", t, re.I): print("FMT", t[max(0,m.start()-150):m.end()].replace("\n"," "))
          ms=parse_page("2026 Grand Slam of Darts", t); print("N", len(ms)); [print("M", m) for m in ms[:6]]
          ms5=parse_page("2025 Grand Slam of Darts", pg["2025 Grand Slam of Darts"]); print("2025 N", len(ms5), sum(1 for m in ms5 if m.get("group")))
          PY
