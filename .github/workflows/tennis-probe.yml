# One-off check of the tennis data sources (safe to delete).
name: Tennis probe
on:
  push:
    paths: [".github/workflows/tennis-probe.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          UA="Mozilla/5.0 (PitchOracle tennis)"
          echo "=== TA html"; curl -sSL -A "$UA" https://tennisabstract.com/reports/atp_elo_ratings.html | head -c 5500
          echo; echo "=== poly tennis events titles"
          curl -sS "https://gamma-api.polymarket.com/events?tag_slug=tennis&closed=false&limit=100" | python3 -c "import json,sys;d=json.load(sys.stdin);[print(e.get('slug'),'|',e.get('title'),'|',e.get('seriesSlug'),'|',[t.get('slug') for t in e.get('tags',[])][:6]) for e in d[:40]]"
          echo "=== poly series atp"
          curl -sS "https://gamma-api.polymarket.com/series?slug=atp" | head -c 1500; echo
          curl -sS "https://gamma-api.polymarket.com/events?series_slug=atp&closed=false&limit=3" | head -c 2500; echo
          echo "=== poly page next data"
          curl -sSL -A "$UA" https://polymarket.com/sports/atp/games -o pa.html; wc -c pa.html
          python3 - <<'PY'
          import re,json
          h=open('pa.html',encoding='utf-8',errors='replace').read()
          m=re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>',h,re.S)
          print('next data', bool(m))
          if m:
              s=m.group(1); i=s.find('"outcomePrices"'); print(s[max(0,i-3000):i+800])
              print('slugs',sorted(set(re.findall(r'"slug":"((?:atp|wta)-[a-z0-9-]+)"',s)))[:20])
          PY
