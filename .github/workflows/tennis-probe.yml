# One-off check of the tennis data sources (safe to delete).
name: Tennis probe
on:
  push:
    paths: [".github/workflows/tennis-probe.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          UA="Mozilla/5.0 (PitchOracle tennis)"
          echo "=== TA atp"; curl -sSL -A "$UA" https://tennisabstract.com/reports/atp_elo_ratings.html -o atp.html; wc -c atp.html
          python3 - <<'PY'
          import re
          h=open('atp.html',encoding='utf-8',errors='replace').read()
          i=h.find('<table'); print(h[i:i+2500]); print('...'); m=re.search(r'last update[^<]{0,80}',h,re.I); print('UPDATE:',m and m.group(0))
          PY
          echo "=== kalshi events"
          curl -sS "https://api.elections.kalshi.com/trade-api/v2/events?series_ticker=KXATPMATCH&status=open&with_nested_markets=true&limit=2" | python3 -c "import json,sys;d=json.load(sys.stdin);print(json.dumps(d,indent=1)[:5000])"
          echo "=== kalshi settled"
          curl -sS "https://api.elections.kalshi.com/trade-api/v2/markets?series_ticker=KXWTAMATCH&status=settled&limit=2" | python3 -c "import json,sys;d=json.load(sys.stdin);print(json.dumps(d,indent=1)[:3000])"
          echo "=== poly sports"
          curl -sS "https://gamma-api.polymarket.com/sports" | python3 -c "import json,sys;d=json.load(sys.stdin);print([x for x in d if any(k in json.dumps(x).lower() for k in ('atp','wta','tennis'))][:6])"
          echo "=== poly events atp"
          curl -sS "https://gamma-api.polymarket.com/events?tag_slug=atp&closed=false&limit=2" | python3 -c "import json,sys;d=json.load(sys.stdin);print(json.dumps(d,indent=1)[:6000])"
          echo "=== poly closed wta"
          curl -sS "https://gamma-api.polymarket.com/events?tag_slug=wta&closed=true&limit=1&order=endDate&ascending=false" | python3 -c "import json,sys;d=json.load(sys.stdin);print(json.dumps(d,indent=1)[:3000])"
