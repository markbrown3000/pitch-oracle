name: Darts probe
on:
  push:
    branches: [main]
    paths: ["tools/darts_probe.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/darts_probe.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "Darts probe" && (git push || (git pull --rebase && git push))
